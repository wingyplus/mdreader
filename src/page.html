<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      body {
        margin: 0;
        display: flex;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }
      main {
        flex: 1;
        min-width: 0;
        max-width: 48rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      pre {
        background: #f5f5f5;
        padding: 1rem;
        overflow-x: auto;
      }
      code {
        font-family: ui-monospace, monospace;
      }
      .hl-comment {
        color: #6e7781;
        font-style: italic;
      }
      .hl-keyword,
      .hl-operator,
      .hl-punctuation-special {
        color: #cf222e;
      }
      .hl-string,
      .hl-string-special {
        color: #0a3069;
      }
      .hl-escape,
      .hl-string-escape,
      .hl-string-regex,
      .hl-tag {
        color: #116329;
      }
      .hl-attribute,
      .hl-boolean,
      .hl-constant,
      .hl-constant-builtin,
      .hl-number,
      .hl-property,
      .hl-variable-builtin {
        color: #0550ae;
      }
      .hl-constructor,
      .hl-function,
      .hl-function-builtin,
      .hl-function-macro {
        color: #8250df;
      }
      .hl-label,
      .hl-module,
      .hl-namespace,
      .hl-type,
      .hl-type-builtin,
      .hl-variable-parameter {
        color: #953800;
      }
      table {
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.25rem 0.5rem;
      }
      img {
        max-width: 100%;
      }
      .sidebar {
        flex: 0 0 16rem;
        box-sizing: border-box;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 1rem;
        background: #fafafa;
        border-right: 1px solid #ddd;
        font-size: 0.9rem;
      }
      .sidebar ul {
        list-style: none;
        margin: 0;
        padding-left: 1rem;
      }
      .sidebar > ul {
        padding-left: 0;
      }
      .sidebar a {
        color: inherit;
        text-decoration: none;
      }
      .sidebar a:hover {
        text-decoration: underline;
      }
      .sidebar a.root {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
      }
      .sidebar a.active {
        font-weight: bold;
        color: #0550ae;
      }
      .sidebar .dir {
        color: #666;
      }
      @media (max-width: 40rem) {
        body {
          flex-direction: column;
        }
        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid #ddd;
        }
      }
    </style>
  </head>
  <body>
    {{sidebar}}
    <main>{{body}}</main>
  </body>
</html>
