<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        display: flex;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }
      main {
        flex: 1;
        min-width: 0;
        max-width: 48rem;
        margin: 2rem auto;
        padding: 0 1rem;
        overflow-wrap: break-word;
      }
      pre {
        background: #f5f5f5;
        padding: 1rem;
        overflow-x: auto;
      }
      code {
        font-family: ui-monospace, monospace;
      }
      .hl-comment {
        color: #6e7781;
        font-style: italic;
      }
      .hl-keyword,
      .hl-operator,
      .hl-punctuation-special {
        color: #cf222e;
      }
      .hl-string,
      .hl-string-special {
        color: #0a3069;
      }
      .hl-escape,
      .hl-string-escape,
      .hl-string-regex,
      .hl-tag {
        color: #116329;
      }
      .hl-attribute,
      .hl-boolean,
      .hl-constant,
      .hl-constant-builtin,
      .hl-number,
      .hl-property,
      .hl-variable-builtin {
        color: #0550ae;
      }
      .hl-constructor,
      .hl-function,
      .hl-function-builtin,
      .hl-function-macro {
        color: #8250df;
      }
      .hl-label,
      .hl-module,
      .hl-namespace,
      .hl-type,
      .hl-type-builtin,
      .hl-variable-parameter {
        color: #953800;
      }
      /* Wide tables scroll on their own instead of widening the page. */
      table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.25rem 0.5rem;
      }
      img {
        max-width: 100%;
      }
      .sidebar {
        flex: 0 0 16rem;
        box-sizing: border-box;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 1rem;
        background: #fafafa;
        border-right: 1px solid #ddd;
        font-size: 0.9rem;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .menu-toggle {
        display: none;
        padding: 0.5rem;
        margin-left: -0.5rem;
        line-height: 0;
        color: inherit;
        background: none;
        border: 0;
        border-radius: 0.25rem;
        cursor: pointer;
      }
      .menu-toggle:hover,
      .menu-toggle[aria-expanded="true"] {
        background: #eee;
      }
      .sidebar ul {
        list-style: none;
        margin: 0;
        padding-left: 1rem;
      }
      .sidebar-tree > ul {
        padding-left: 0;
      }
      .sidebar a {
        color: inherit;
        text-decoration: none;
      }
      .sidebar a:hover {
        text-decoration: underline;
      }
      .sidebar a.root {
        font-weight: bold;
      }
      .sidebar a.active {
        font-weight: bold;
        color: #0550ae;
      }
      .sidebar .dir {
        color: #666;
      }
      @media (max-width: 40rem) {
        body {
          flex-direction: column;
        }
        main {
          margin: 1rem 0;
        }
        blockquote {
          margin-inline: 1rem;
        }
        .sidebar {
          flex: none;
          position: static;
          height: auto;
          padding: 0.5rem 1rem;
          border-right: 0;
          border-bottom: 1px solid #ddd;
        }
        .sidebar-tree a,
        .sidebar-tree .dir {
          display: inline-block;
          padding: 0.25rem 0;
        }
      }
      /* Collapsing needs the toggle script; without it the tree simply stays expanded. */
      @media (max-width: 40rem) and (scripting: enabled) {
        .sidebar {
          position: sticky;
          z-index: 1;
          max-height: 100vh;
          max-height: 100dvh;
        }
        .menu-toggle {
          display: block;
        }
        .sidebar:not(.open) .sidebar-header {
          margin-bottom: 0;
        }
        .sidebar:not(.open) .sidebar-tree {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    {{sidebar}}
    <main>{{body}}</main>
    <script>
      for (const button of document.querySelectorAll(".menu-toggle")) {
        button.addEventListener("click", () => {
          const open = button.getAttribute("aria-expanded") !== "true";
          button.setAttribute("aria-expanded", open);
          button.closest(".sidebar").classList.toggle("open", open);
        });
      }
    </script>
  </body>
</html>
