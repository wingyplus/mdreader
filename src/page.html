<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="mdreader-etag" content="{{etag}}" />
    <title>{{title}}</title>
    <script>
      // Apply the saved theme before the page renders to avoid a flash of the wrong theme.
      try {
        const theme = localStorage.getItem("mdreader-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <style>
      /* Colors follow the system theme unless `data-theme` pins one; `light-dark()` picks from the
         active `color-scheme`. */
      :root {
        color-scheme: light dark;
        --bg: light-dark(#fff, #0d1117);
        --fg: light-dark(#000, #e6edf3);
        --muted: light-dark(#666, #9198a1);
        --accent: light-dark(#0550ae, #4493f8);
        --border: light-dark(#ddd, #3d444d);
        --code-bg: light-dark(#f5f5f5, #151b23);
        --sidebar-bg: light-dark(#fafafa, #010409);
        --hover-bg: light-dark(#eee, #262c36);
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        display: flex;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
        color: var(--fg);
        background: var(--bg);
      }
      main {
        flex: 1;
        min-width: 0;
        max-width: 48rem;
        margin: 2rem auto;
        padding: 0 1rem;
        overflow-wrap: break-word;
      }
      pre {
        background: var(--code-bg);
        padding: 1rem;
        overflow-x: auto;
      }
      code {
        font-family: ui-monospace, monospace;
      }
      /* A rendered diagram drops the code block styling around its SVG. */
      pre.mermaid.rendered {
        padding: 0;
        background: none;
        text-align: center;
        white-space: normal;
        font-family: inherit;
      }
      .hl-comment {
        color: light-dark(#6e7781, #9198a1);
        font-style: italic;
      }
      .hl-keyword,
      .hl-operator,
      .hl-punctuation-special {
        color: light-dark(#cf222e, #ff7b72);
      }
      .hl-string,
      .hl-string-special {
        color: light-dark(#0a3069, #a5d6ff);
      }
      .hl-escape,
      .hl-string-escape,
      .hl-string-regex,
      .hl-tag {
        color: light-dark(#116329, #7ee787);
      }
      .hl-attribute,
      .hl-boolean,
      .hl-constant,
      .hl-constant-builtin,
      .hl-number,
      .hl-property,
      .hl-variable-builtin {
        color: light-dark(#0550ae, #79c0ff);
      }
      .hl-constructor,
      .hl-function,
      .hl-function-builtin,
      .hl-function-macro {
        color: light-dark(#8250df, #d2a8ff);
      }
      .hl-label,
      .hl-module,
      .hl-namespace,
      .hl-type,
      .hl-type-builtin,
      .hl-variable-parameter {
        color: light-dark(#953800, #ffa657);
      }
      /* Wide tables scroll on their own instead of widening the page. */
      table {
        display: block;
        max-width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid light-dark(#ccc, #3d444d);
        padding: 0.25rem 0.5rem;
      }
      img {
        max-width: 100%;
      }
      .sidebar {
        flex: 0 0 16rem;
        box-sizing: border-box;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 1rem;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--border);
        font-size: 0.9rem;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .menu-toggle,
      .theme-toggle {
        display: none;
        padding: 0.5rem;
        line-height: 0;
        color: inherit;
        background: none;
        border: 0;
        border-radius: 0.25rem;
        cursor: pointer;
      }
      .menu-toggle {
        margin-left: -0.5rem;
      }
      .menu-toggle:hover,
      .menu-toggle[aria-expanded="true"],
      .theme-toggle:hover {
        background: var(--hover-bg);
      }
      .theme-toggle {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        z-index: 2;
      }
      /* The icon shows the active theme. */
      .theme-toggle svg {
        display: none;
      }
      :root:not([data-theme]) .theme-toggle .icon-system,
      :root[data-theme="light"] .theme-toggle .icon-light,
      :root[data-theme="dark"] .theme-toggle .icon-dark {
        display: block;
      }
      .sidebar ul {
        list-style: none;
        margin: 0;
        padding-left: 1rem;
      }
      .sidebar-tree > ul {
        padding-left: 0;
      }
      .sidebar a {
        color: inherit;
        text-decoration: none;
      }
      .sidebar a:hover {
        text-decoration: underline;
      }
      .sidebar a.root {
        font-weight: bold;
      }
      .sidebar a.active {
        font-weight: bold;
        color: var(--accent);
      }
      .sidebar .dir {
        color: var(--muted);
      }
      @media (scripting: enabled) {
        .theme-toggle {
          display: block;
        }
      }
      @media (max-width: 40rem) {
        body {
          flex-direction: column;
        }
        main {
          margin: 1rem 0;
        }
        blockquote {
          margin-inline: 1rem;
        }
        .sidebar {
          flex: none;
          position: static;
          height: auto;
          padding: 0.5rem 1rem;
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }
        .sidebar-tree a,
        .sidebar-tree .dir {
          display: inline-block;
          padding: 0.25rem 0;
        }
      }
      /* Collapsing needs the toggle script; without it the tree simply stays expanded. */
      @media (max-width: 40rem) and (scripting: enabled) {
        .sidebar {
          position: sticky;
          z-index: 1;
          max-height: 100vh;
          max-height: 100dvh;
        }
        .menu-toggle {
          display: block;
        }
        .sidebar:not(.open) .sidebar-header {
          margin-bottom: 0;
        }
        .sidebar:not(.open) .sidebar-tree {
          display: none;
        }
        /* Keep the theme toggle clear of the sidebar title, or of the content without a sidebar. */
        .sidebar-header {
          padding-right: 2rem;
        }
        main:first-child {
          margin-top: 3rem;
        }
      }
    </style>
  </head>
  <body>
    {{sidebar}}
    <main>{{body}}</main>
    <button class="theme-toggle" type="button">
      <svg class="icon-system" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"
        fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
        <rect x="2.5" y="3.5" width="15" height="10" rx="1.5" />
        <path d="M7 17h6M10 13.5V17" />
      </svg>
      <svg class="icon-light" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"
        fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="10" cy="10" r="3.5" />
        <path
          d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.4 1.4M14.6 14.6 16 16M4 16l1.4-1.4M14.6 5.4 16 4"
        />
      </svg>
      <svg class="icon-dark" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"
        fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M16.5 12.5A7 7 0 0 1 7.5 3.5a7 7 0 1 0 9 9z" />
      </svg>
    </button>
    <script>
      for (const button of document.querySelectorAll(".menu-toggle")) {
        button.addEventListener("click", () => {
          const open = button.getAttribute("aria-expanded") !== "true";
          button.setAttribute("aria-expanded", open);
          button.closest(".sidebar").classList.toggle("open", open);
        });
      }

      // Cycles system -> light -> dark. "system" clears the override and follows the OS setting.
      const themes = ["system", "light", "dark"];
      const themeToggle = document.querySelector(".theme-toggle");
      const currentTheme = () => document.documentElement.dataset.theme ?? "system";
      const labelThemeToggle = () => {
        const theme = currentTheme();
        const next = themes[(themes.indexOf(theme) + 1) % themes.length];
        themeToggle.title = `Theme: ${theme}`;
        themeToggle.setAttribute("aria-label", `Theme: ${theme}. Switch to ${next}.`);
      };
      themeToggle.addEventListener("click", () => {
        const theme = themes[(themes.indexOf(currentTheme()) + 1) % themes.length];
        try {
          if (theme === "system") {
            delete document.documentElement.dataset.theme;
            localStorage.removeItem("mdreader-theme");
          } else {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem("mdreader-theme", theme);
          }
        } catch {}
        labelThemeToggle();
        renderDiagrams();
      });
      labelThemeToggle();

      // Mermaid is only loaded once a page has diagrams, and they are drawn again whenever the
      // effective theme or the page changes. Until then, or if mermaid fails to load, the source
      // is shown.
      const diagramSources = new WeakMap();
      const trackDiagrams = (root) => {
        for (const diagram of root.querySelectorAll("pre.mermaid")) {
          diagramSources.set(diagram, diagram.textContent);
        }
      };
      trackDiagrams(document);
      const darkScheme = matchMedia("(prefers-color-scheme: dark)");
      let mermaidModule;
      const loadMermaid = () =>
        (mermaidModule ??= import(
          "https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.esm.min.mjs"
        ).then(
          ({ default: mermaid }) => mermaid,
          (err) => console.error("mdreader: cannot load mermaid", err),
        ));
      let diagramRenders = 0;
      const renderDiagrams = async () => {
        // A newer render, started by a theme change or a page update, supersedes this one.
        const render = ++diagramRenders;
        const diagrams = [...document.querySelectorAll("pre.mermaid")];
        if (diagrams.length === 0) return;
        const mermaid = await loadMermaid();
        if (!mermaid || render !== diagramRenders) return;
        const theme = currentTheme();
        const dark = theme === "dark" || (theme === "system" && darkScheme.matches);
        mermaid.initialize({
          startOnLoad: false,
          theme: dark ? "dark" : "default",
          suppressErrorRendering: true,
        });
        for (const [i, diagram] of diagrams.entries()) {
          // Some diagrams, such as Gantt charts, size themselves to the element they are drawn
          // in, so draw each one out of sight at the width it will occupy.
          const scratch = document.createElement("div");
          scratch.style.cssText = `position: absolute; visibility: hidden; overflow: hidden; height: 0; width: ${diagram.offsetWidth}px`;
          diagram.before(scratch);
          try {
            const { svg, bindFunctions } = await mermaid.render(
              `mermaid-${render}-${i}`,
              diagramSources.get(diagram),
              scratch,
            );
            if (render !== diagramRenders) return;
            diagram.innerHTML = svg;
            diagram.classList.add("rendered");
            bindFunctions?.(diagram);
          } catch (err) {
            if (render !== diagramRenders) return;
            diagram.textContent = diagramSources.get(diagram);
            diagram.classList.remove("rendered");
            console.error("mdreader: cannot render mermaid diagram", err);
          } finally {
            scratch.remove();
          }
        }
      };
      darkScheme.addEventListener("change", () => {
        if (currentTheme() === "system") renderDiagrams();
      });
      renderDiagrams();

      // Replaces the content and file tree with those of a newer version of the page, keeping the
      // scroll position and the sidebar state.
      const updatePage = (page) => {
        document.title = page.title;
        const tree = document.querySelector(".sidebar-tree");
        const newTree = page.querySelector(".sidebar-tree");
        if (tree && newTree) tree.replaceChildren(...newTree.childNodes);

        // Unchanged diagrams keep their drawing until they are drawn again, instead of flashing
        // back to their source.
        const main = document.querySelector("main");
        const newMain = page.querySelector("main");
        const drawings = new Map();
        for (const diagram of main.querySelectorAll("pre.mermaid.rendered")) {
          drawings.set(diagramSources.get(diagram), diagram.innerHTML);
        }
        trackDiagrams(newMain);
        for (const diagram of newMain.querySelectorAll("pre.mermaid")) {
          const drawing = drawings.get(diagramSources.get(diagram));
          if (drawing === undefined) continue;
          diagram.innerHTML = drawing;
          diagram.classList.add("rendered");
        }
        main.replaceChildren(...newMain.childNodes);
        renderDiagrams();
      };

      // While the page is visible, ask the server every second whether it changed. The server
      // answers 304 Not Modified until the markdown, or the file tree, is edited.
      let etag = document.querySelector('meta[name="mdreader-etag"]').content;
      let refreshTimer;
      let refreshing = false;
      const refresh = async () => {
        clearTimeout(refreshTimer);
        // A hidden page stops polling until it becomes visible again.
        if (refreshing || document.hidden) return;
        refreshing = true;
        try {
          const response = await fetch(location.href, {
            cache: "no-store",
            headers: { "If-None-Match": etag },
          });
          if (response.ok) {
            const html = await response.text();
            etag = response.headers.get("ETag") ?? etag;
            updatePage(new DOMParser().parseFromString(html, "text/html"));
          }
        } catch {
          // The server may be restarting; try again on the next poll.
        } finally {
          refreshing = false;
        }
        refreshTimer = setTimeout(refresh, 1000);
      };
      document.addEventListener("visibilitychange", refresh);
      refreshTimer = setTimeout(refresh, 1000);
    </script>
  </body>
</html>
